[ssh_connection]
# Accept and pin a host key on first contact instead of prompting.
# Ansible's ssh runs without a TTY, so the default "ask" behaviour fails with
# "Host key verification failed" / ssh_askpass errors on a fresh host.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
