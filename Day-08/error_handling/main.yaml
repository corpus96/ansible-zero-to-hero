---
- hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Make sure the packages openssh and openssl are up to date
      ansible.builtin.apt:
        name: "{{ item }}"
        state: latest
      ignore_errors: yes
      loop:
        - openssh
        - openssl

    - name: Verify if Docker is installed
      ansible.builtin.command: docker --version
      register: output

      #Ignore errors makes to go to the next tasks, otherwise playbook wont continue
      ignore_errors: yes

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present
      when: 
        output.failed
    - name: Check if a file exists in temp and fail task if it does
      ansible.builtin.command: ls /tmp/this_should_not_be_here
      register: result
      failed_when:
        - result.rc == 0
        - '"No such" not in result.stderr'
    #Prints the result error from task above
    - ansible.builtin.debug:
        var: result

