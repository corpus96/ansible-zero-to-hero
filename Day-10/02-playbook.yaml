---
- name: Enforce s3 versioning on AWS
  hosts: localhost
  gather_facts: false

  tasks:
    # Step 1: List all s3 buckets in an array
    # Step 2: Loop each item array from Step 1 and add its versioning
    - name: List all S3 buckets in AWS
      amazon.aws.s3_bucket_info:
        name_filter: ansible  # only buckets whose name contains "ansible"
      register: result

    - name: Show bucket list
      ansible.builtin.debug:
        var: result

    - name: Enable versioning on S3 bucket
      amazon.aws.s3_bucket:
        name: "{{ item.name }}"
        versioning: true
      loop: "{{ result.buckets }}"
